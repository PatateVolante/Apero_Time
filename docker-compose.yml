# Déploiement simple :  cp .env.example .env  &&  docker compose up -d
# -> http://<serveur>:5001   (Traefik : voir COMPOSE_FILE dans .env.example)
services:
  apero:
    image: ghcr.io/patatevolante/apero_time:${APERO_TAG:-latest}
    build: .
    container_name: apero_time
    ports:
      - "${APERO_PORT:-5001}:5001"
    environment:
      APERO_HOUR: ${APERO_HOUR:-18}
      APERO_END_HOUR: ${APERO_END_HOUR:-24}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      GIPHY_RATING: ${GIPHY_RATING:-pg}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
